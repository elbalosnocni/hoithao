<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký Hội thao Liwayway 2026</title><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>
:root{--p:#0d6efd;--dark:#172033;--muted:#667085;--line:#e4e7ec;--bg:#f4f6f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Segoe UI",Arial,sans-serif;color:var(--dark)}.container{max-width:920px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;box-shadow:0 8px 30px #10182814}.form-card{padding:28px}.brand{position:relative;text-align:center;border-bottom:3px solid #ffc107;padding:8px 70px 16px;margin-bottom:22px}h1{font-size:24px;margin:0;color:var(--p)}.subtitle{color:var(--muted);margin:6px 0;font-weight:600}.admin-link{position:absolute;right:0;top:0;background:var(--dark);color:#fff;text-decoration:none;padding:8px 11px;border-radius:8px;font-size:12px;font-weight:700}.field{margin-bottom:16px}.label{display:block;font-weight:700;margin-bottom:7px}.required{color:#dc3545}input,select{width:100%;border:1px solid #ced4da;border-radius:8px;padding:11px 12px;font-size:15px;background:#fff}.radio-row{display:flex;gap:24px;flex-wrap:wrap}.radio{display:flex;gap:7px;align-items:center;font-weight:600}.radio input{width:auto}.btn{border:0;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer}.btn-primary{background:var(--p);color:#fff}.btn-secondary{background:#198754;color:#fff}.btn-light{background:#eef2f6;color:var(--dark)}.btn:disabled{opacity:.6}.hidden{display:none!important}.search-box{background:#fff9e6;border:1px solid #ffda6a;padding:13px;border-radius:10px}.results{margin-top:6px;max-height:250px;overflow:auto}.result{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);padding:9px;border-radius:7px;cursor:pointer;margin:4px 0}.result-main{font-weight:700;color:var(--p)}.detail,.small{font-size:12px;color:var(--muted)}.selected-box{padding:10px;border:1px solid #b7d4ff;background:#f2f7ff;border-radius:8px;margin-top:8px}.rule{margin-top:8px;padding:9px 10px;border-radius:8px;background:#eef6ff;color:#175cd3;font-weight:700}.deadline-box{padding:10px 12px;border-radius:9px;background:#eef6ff;color:#175cd3;margin-bottom:16px;font-weight:600}.status{padding:11px;border-radius:8px;margin-bottom:14px;font-weight:600}.status.error{background:#fff0f0;color:#b42318}.status.ok{background:#ecfdf3;color:#027a48}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px}.members{width:100%;border-collapse:collapse;min-width:680px}.members th,.members td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:middle}.members th{background:#f8f9fa;font-size:13px}.members input{padding:7px;font-size:13px}.submit{width:100%;font-size:16px;padding:14px;margin-top:10px}.loading-overlay,.confirm-overlay{position:fixed;inset:0;z-index:20;background:#fffefbf2;display:flex;align-items:center;justify-content:center;padding:14px}.confirm-overlay{background:#172033aa;z-index:50}.confirm-card{background:#fff;width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:22px}.spinner{width:32px;height:32px;border:4px solid #d0d5dd;border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}.confirm-detail{background:#f8f9fa;padding:13px;border-radius:10px;line-height:1.6}.qr{text-align:center;padding:14px}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}@media(max-width:600px){.container{padding:8px}.form-card{padding:16px}h1{font-size:20px}.brand{padding-right:58px}.admin-link{font-size:10px}.members{min-width:680px}input,select{font-size:16px}}
</style></head><body>
<div id="loading" class="loading-overlay"><div style="text-align:center"><div class="spinner"></div><b>Đang tải dữ liệu...</b><br><span class="small">Nếu lâu, bấm tải lại.</span><br><button class="btn btn-light" style="margin-top:10px" onclick="loadAll(true)">↻ Tải lại</button></div></div>
<main class="container"><section class="card form-card"><header class="brand"><a class="admin-link" href="admin.html">🔐 ADMIN</a><h1>LIWAYWAY SPORTS FESTIVAL 2026</h1><div class="subtitle">CỔNG ĐĂNG KÝ THAM GIA HỘI THAO</div></header><div id="deadline" class="deadline-box hidden"></div><div id="status" class="status hidden"></div>
<form id="form" novalidate><div class="field"><span class="label">Hình thức đăng ký <span class="required">*</span></span><div class="radio-row"><label class="radio"><input type="radio" name="type" value="Cá nhân" checked> Cá nhân</label><label class="radio"><input type="radio" name="type" value="Đội nhóm"> Đội nhóm</label></div></div>
<div id="individualBox"><div class="field"><label class="label">Họ và tên người đăng ký <span class="required">*</span></label><div class="search-box"><input id="individualSearch" autocomplete="off" placeholder="🔍 Tên, Mã NV hoặc CCCD"><div id="individualResults" class="results"></div><div id="selectedIndividual" class="selected-box hidden"></div></div></div></div>
<div id="teamNameBox" class="field hidden"><label class="label">Tên đội thi đấu <span class="required">*</span></label><input id="teamName" placeholder="VD: Đội Cơ Khí"></div>
<div class="field"><label class="label">Môn thi đấu <span class="required">*</span></label><select id="game" required><option value="">-- Chọn môn thi đấu --</option></select><div id="rule" class="rule hidden"></div></div>
<section id="teamBox" class="hidden"><div style="background:#eef2f6;padding:10px 13px;border-radius:8px;font-weight:700;margin:20px 0 14px">DANH SÁCH THÀNH VIÊN (<span id="count">0</span> người)<button type="button" id="addManual" class="btn btn-secondary" style="float:right;padding:6px 9px">+ Thêm thủ công</button><div style="clear:both"></div></div><div class="search-box"><label class="label">🔍 Dò nhân viên bằng Tên, Mã NV hoặc CCCD</label><input id="staffSearch" autocomplete="off" placeholder="Nhập tên..."><div id="staffResults" class="results"></div></div><div class="table-wrap" style="margin-top:13px"><table class="members"><thead><tr><th>Họ tên</th><th>Mã NV</th><th>CCCD</th><th>Phòng ban</th><th>Bộ phận</th><th>Chức vụ</th><th></th></tr></thead><tbody id="members"></tbody></table></div></section>
<button class="btn btn-primary submit" id="submit">GỬI ĐĂNG KÝ / SUBMIT</button></form></section></main>
<div id="confirm" class="confirm-overlay hidden"><div class="confirm-card"><div style="display:flex;justify-content:space-between"><div><h2 style="margin:0 0 4px">✅ ĐĂNG KÝ THÀNH CÔNG</h2><span class="small">Lưu mã/QR để đối chiếu.</span></div><button class="btn btn-light" onclick="closeConfirm()">✕</button></div><hr><div id="confirmDetail" class="confirm-detail"></div><div class="qr"><div id="qrcode"></div><div>Mã xác nhận: <b id="code"></b></div></div><div class="actions"><button class="btn btn-primary" onclick="downloadQR()">📲 Lưu QR</button><button class="btn btn-light" onclick="closeConfirm()">Đóng</button></div></div></div>
<script>
const WEB_APP_URL="https://script.google.com/macros/s/AKfycbzSF32zHezk8gMhpiQrSbwSwWIbeLd4hzDhMjeW3Gch9wL9ZvMo2m6HYILSWrwVFJlL/exec";const $=id=>document.getElementById(id);let employees=[],games=[],selected=null,open=true,lastCode='',lastQR='';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}function marks(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase();}function status(m,t='error'){const e=$('status');e.textContent=m;e.className='status '+t;}function hideStatus(){$('status').className='status hidden';}
async function getJSON(url,opts={},label='Kết nối máy chủ'){
  const maxTry=3, timeoutMs=18000;
  let lastErr;
  for(let attempt=1;attempt<=maxTry;attempt++){
    const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),timeoutMs);
    try{
      const r=await fetch(url,{...opts,signal:ctl.signal,cache:opts.cache||'no-store',redirect:'follow'});
      const text=await r.text();
      if(!r.ok) throw new Error('Máy chủ trả về HTTP '+r.status+'.');
      let data; try{data=JSON.parse(text);}catch(e){throw new Error('API không trả về JSON hợp lệ. Có thể Web App chưa deploy đúng phiên bản.');}
      return data;
    }catch(e){
      lastErr=e.name==='AbortError'?new Error(label+' quá thời gian chờ.'):e;
      if(attempt<maxTry) await new Promise(r=>setTimeout(r,700*attempt));
    }finally{clearTimeout(timer);}
  }
  if(lastErr && (lastErr.message==='Failed to fetch'||/fetch/i.test(lastErr.message)))
    throw new Error('Không kết nối được máy chủ. Hãy kiểm tra URL Web App /exec, quyền Anyone và mạng Internet rồi thử lại.');
  throw lastErr||new Error('Không thể kết nối máy chủ.');
}
async function loadAll(force){
  const box=$('loading');
  box.classList.remove('hidden');
  try{
    if(force)localStorage.removeItem('HOITHAO_EMPLOYEES_V4');
    const [er,gr,sr]=await Promise.all([
      getJSON(WEB_APP_URL+'?action=getEmployees&v=5',{},'Tải danh sách nhân viên'),
      getJSON(WEB_APP_URL+'?action=getGames&v=5',{},'Tải danh sách môn'),
      getJSON(WEB_APP_URL+'?action=getRegistrationStatus&v=5',{},'Tải trạng thái đăng ký')
    ]);
    if(er.result!=='success')throw Error(er.message||'Không tải được nhân viên.');
    employees=Array.isArray(er.data)?er.data:[];
    games=gr.result==='success'?(gr.data||[]):[];
    renderGames();
    if(sr.result==='success')renderStatus(sr.data);
    hideStatus();
  }catch(e){
    console.error(e);
    status(e.message||'Không thể tải dữ liệu.','error');
  }finally{
    box.classList.add('hidden');
  }
}

function renderStatus(s){open=!!s.open;$('submit').disabled=!open;if(s.deadlineMs){const d=new Date(Number(s.deadlineMs));$('deadline').textContent=open?'🟢 Đăng ký mở đến '+d.toLocaleString('vi-VN'):'🔴 Đã hết hạn đăng ký';$('deadline').className='deadline-box';}else $('deadline').className='deadline-box hidden';if(!open)status('Thời hạn đăng ký đã kết thúc.','error');}
function renderGames(){const type=document.querySelector('input[name=type]:checked').value;const list=games.filter(g=>g.type===type);$('game').innerHTML='<option value="">-- Chọn môn thi đấu --</option>'+list.map(g=>'<option value="'+esc(g.code)+'">'+esc(g.name)+'</option>').join('');updateRule();}
function currentGame(){return games.find(g=>g.code===$('game').value)||null;}
function updateRule(){const g=currentGame();if(!g){$('rule').className='rule hidden';return;}const limit=g.min===g.max?'Đúng '+g.min:g.min+'–'+g.max;$('rule').innerHTML='📌 '+esc(g.description||'')+' &nbsp;|&nbsp; Số người: '+limit+' &nbsp;|&nbsp; Thể thức: '+esc(g.format||'');$('rule').className='rule';if(g.type==='Cá nhân'){$('teamBox').classList.add('hidden');}else $('teamBox').classList.remove('hidden');}
function setMode(){const group=document.querySelector('input[name=type]:checked').value==='Đội nhóm';$('individualBox').classList.toggle('hidden',group);$('teamNameBox').classList.toggle('hidden',!group);$('teamBox').classList.toggle('hidden',!group);selected=null;$('selectedIndividual').classList.add('hidden');$('individualSearch').value='';$('members').innerHTML='';$('count').textContent='0';renderGames();}
function searchStaff(input,target,click){const q=marks(input.trim());if(q.length<2){target.innerHTML='';return;}const arr=employees.filter(e=>marks(e.hoTen).includes(q)||marks(e.maNV).includes(q)||String(e.cccd||'').includes(q)).slice(0,8);target.innerHTML=arr.map((e,i)=>'<button type="button" class="result" data-i="'+i+'"><div class="result-main">'+esc(e.hoTen)+'</div><div class="detail">Mã NV: '+esc(e.maNV)+' | CCCD: '+esc(e.cccd)+' | '+esc(e.phongBan)+' / '+esc(e.boPhan)+'</div></button>').join('');target.querySelectorAll('.result').forEach((b,i)=>b.onclick=()=>click(arr[i]));}
$('individualSearch').oninput=e=>searchStaff(e.target.value,$('individualResults'),e=>{selected=e;$('selectedIndividual').innerHTML='<b>'+esc(e.hoTen)+'</b><br>Mã NV: '+esc(e.maNV)+' | CCCD: '+esc(e.cccd)+'<br>'+esc(e.phongBan)+' / '+esc(e.boPhan);$('selectedIndividual').classList.remove('hidden');$('individualResults').innerHTML='';});
$('staffSearch').oninput=e=>searchStaff(e.target.value,$('staffResults'),addMember);function addMember(e){const existing=[...$('members').querySelectorAll('.member-id')].map(x=>x.value);if(existing.includes(e.maNV)||existing.includes(e.cccd)){status('Nhân viên này đã có trong đội.');return;}const tr=document.createElement('tr');tr.innerHTML='<td><input class="member-name" value="'+esc(e.hoTen)+'" readonly><input class="member-full-cccd" type="hidden" value="'+esc(e.cccd)+'"></td><td><input class="member-id" value="'+esc(e.maNV)+'" readonly></td><td>'+esc(String(e.cccd||'').slice(-4))+'</td><td><input value="'+esc(e.phongBan)+'" readonly></td><td><input value="'+esc(e.boPhan)+'" readonly></td><td><input value="'+esc(e.chucVu)+'" readonly></td><td><button type="button" class="btn btn-light remove">✕</button></td>';tr.querySelector('.remove').onclick=()=>{tr.remove();updateCount();};$('members').appendChild(tr);$('staffSearch').value='';$('staffResults').innerHTML='';updateCount();hideStatus();}
function updateCount(){$('count').textContent=$('members').querySelectorAll('tr').length;updateRule();}
$('addManual').onclick=()=>status('Vui lòng tìm và chọn nhân viên từ danh sách để bảo đảm mã NV/CCCD chính xác.','error');
$('game').onchange=updateRule;document.querySelectorAll('input[name=type]').forEach(x=>x.onchange=setMode);
function validate(){if(!open)return false;const g=currentGame(),group=document.querySelector('input[name=type]:checked').value==='Đội nhóm';if(!g){status('Vui lòng chọn môn thi đấu.');return false;}if(group){if(!$('teamName').value.trim()){status('Vui lòng nhập tên đội.');return false;}const n=$('members').querySelectorAll('tr').length;if(n<g.min||n>g.max){status('Môn '+g.name+' yêu cầu '+(g.min===g.max?'đúng '+g.min:'từ '+g.min+' đến '+g.max)+' người. Hiện có '+n+'.');return false;}}else if(!selected){status('Vui lòng chọn người đăng ký.');return false;}return true;}
function memberPayload(){return [...$('members').querySelectorAll('tr')].map((tr,i)=>{const v=s=>tr.querySelector(s)?.value.trim()||'';return {name:v('.member-name'),id:v('.member-id'),cccd:v('.member-full-cccd'),dept:tr.cells[3].querySelector('input').value,section:tr.cells[4].querySelector('input').value,pos:tr.cells[5].querySelector('input').value};});}
$('form').onsubmit=async e=>{e.preventDefault();hideStatus();if(!validate())return;const group=document.querySelector('input[name=type]:checked').value==='Đội nhóm',g=currentGame(),ms=group?memberPayload():[];const memberString=ms.map((m,i)=>(i+1)+'. '+m.name+' - MNV: '+m.id+' - CCCD 4 số cuối: '+m.cccd.slice(-4)+' [Phòng ban: '+m.dept+' - Bộ phận: '+m.section+' - Chức vụ: '+m.pos+']').join(' | ');const payload={action:'register',loaiDangKy:group?'Đội nhóm':'Cá nhân',tenFormTenDoi:group?$('teamName').value.trim():selected.hoTen,monDangKy:g.name,danhSachThanhVien:memberString,memberKeys:group?ms.map(m=>m.id||m.cccd).join('|'):'',maNVDangKy:group?'':selected.maNV,cccdDangKy:group?'':selected.cccd,phongBan:group?'':selected.phongBan,boPhan:group?'':selected.boPhan};$('submit').disabled=true;$('submit').textContent='Đang lưu...';try{const r=await getJSON(WEB_APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)},'Gửi đăng ký');if(r.result!=='success')throw Error(r.message||'Không thể lưu đăng ký.');openConfirm(r);$('form').reset();setMode();}catch(err){console.error(err);status(err.message||'Lỗi kết nối.');}finally{$('submit').disabled=!open;$('submit').textContent='GỬI ĐĂNG KÝ / SUBMIT';}};
function openConfirm(r){lastCode=r.confirmationCode||'';const d=r.data||{};$('code').textContent=lastCode;$('confirmDetail').innerHTML='<b>'+esc(d.tenFormTenDoi)+'</b><br>Môn: '+esc(d.monDangKy)+'<br>Hình thức: '+esc(d.loaiDangKy)+(d.danhSachThanhVien?'<hr>'+d.danhSachThanhVien.split(' | ').map(x=>esc(x.replace(/\s+-\s*MNV:.*/,'').trim())).join('<br>'):'');$('qrcode').innerHTML='';lastQR=location.href.split('?')[0]+'?code='+encodeURIComponent(lastCode);new QRCode($('qrcode'),{text:lastQR,width:190,height:190});$('confirm').classList.remove('hidden');}function closeConfirm(){$('confirm').classList.add('hidden');}function downloadQR(){const c=$('qrcode').querySelector('canvas'),a=document.createElement('a');if(!c)return;a.href=c.toDataURL('image/png');a.download='Xac_Nhan_Hoi_Thao_'+lastCode+'.png';a.click();}
loadAll(false);
</script></body></html>
