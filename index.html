<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng ký Hội thao Liwayway 2026</title>
<style>
:root{--primary:#0d6efd;--dark:#172033;--muted:#667085;--line:#e4e7ec;--bg:#f4f6f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Segoe UI",Arial,sans-serif;color:#172033}
.container{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(16,24,40,.08)}
.form-card{padding:28px}.brand{text-align:center;border-bottom:3px solid #ffc107;padding-bottom:16px;margin-bottom:24px}
h1{font-size:24px;margin:0;color:var(--primary)}.subtitle{color:var(--muted);margin:7px 0 0;font-weight:600}
.section{background:#eef2f6;padding:10px 13px;border-radius:8px;font-weight:700;margin:22px 0 15px}
.field{margin-bottom:16px}.label{display:block;font-weight:700;margin-bottom:7px}.required{color:#dc3545}
input,select{width:100%;border:1px solid #ced4da;border-radius:8px;padding:11px 12px;font-size:15px;background:#fff}
input:focus,select:focus{outline:0;border-color:#86b7fe;box-shadow:0 0 0 3px rgba(13,110,253,.12)}
.radio-row{display:flex;gap:24px;flex-wrap:wrap}.radio{display:flex;align-items:center;gap:8px;font-weight:600}
.radio input{width:auto}.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer}.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:#198754;color:#fff}.btn-danger{background:#dc3545;color:#fff}.btn:disabled{opacity:.6;cursor:not-allowed}
.submit{width:100%;font-size:16px;padding:14px;margin-top:10px}.hidden{display:none!important}
.search-box{background:#fff9e6;border:1px solid #ffda6a;padding:14px;border-radius:10px}.results{margin-top:6px;max-height:260px;overflow:auto}
.result{width:100%;text-align:left;background:#fff;border:1px solid var(--line);padding:10px;border-radius:7px;cursor:pointer;margin-bottom:5px}
.result:hover{background:#f2f7ff}.result-main{font-weight:700;color:var(--primary)}.detail{font-size:12px;color:var(--muted);margin-top:3px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px}.members{width:100%;border-collapse:collapse;min-width:720px}
.members th,.members td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:middle}.members th{background:#f8f9fa;font-size:13px}
.members input{padding:8px;font-size:13px}.small{font-size:13px}.rule{margin-top:8px;padding:8px 10px;border-radius:8px;background:#fff0f0;color:#b42318;font-weight:700}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;z-index:1000;text-align:center}
.spinner{width:32px;height:32px;border:4px solid #d0d5dd;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}
.status{padding:10px;border-radius:8px;margin-bottom:14px}.status.error{background:#fff0f0;color:#b42318}.status.ok{background:#ecfdf3;color:#027a48}
@media(max-width:600px){.container{padding:8px}.form-card{padding:18px}.radio-row{gap:12px}h1{font-size:20px}}
</style>
</head>
<body>
<div id="loadingOverlay" class="loading">
  <div><div class="spinner"></div><strong>Đang tải danh sách nhân viên...</strong><br><span class="small">Please wait...</span></div>
</div>

<main class="container">
<section class="card form-card">
<header class="brand">
  <h1>LIWAYWAY SPORTS FESTIVAL 2026</h1>
  <div class="subtitle">CỔNG ĐĂNG KÝ THAM GIA HỘI THAO</div>
</header>

<div id="status" class="status hidden"></div>

<form id="registrationForm" novalidate>
  <div class="field">
    <span class="label">Hình thức đăng ký / Registration Type <span class="required">*</span></span>
    <div class="radio-row">
      <label class="radio"><input type="radio" name="loaiDangKy" value="Cá nhân" id="typeIndividual" checked> Cá nhân (Marathon)</label>
      <label class="radio"><input type="radio" name="loaiDangKy" value="Đội nhóm" id="typeGroup"> Đội nhóm</label>
    </div>
  </div>

  <div class="section">THÔNG TIN CHUNG / GENERAL INFORMATION</div>

  <div class="field">
    <label class="label" for="congTy">công ty <span class="required">*</span></label>
    <select id="congTy" required>
      <option value="">-- Chọn Công ty --</option>
      <option value="K1">Liwayway Việt Nam</option>
      <option value="K2">Liwayway Sài Gòn</option>
    </select>
  </div>

  <div class="field">
    <label class="label" for="boPhan">Bộ phận cụ thể <span class="required">*</span></label>
    <input id="boPhan" required placeholder="VD: Cashier, IT, Accounting, Xưởng 1...">
  </div>

  <div class="field">
    <label class="label" id="labelName" for="tenFormTenDoi">Họ và tên người đăng ký <span class="required">*</span></label>
    <input id="tenFormTenDoi" required placeholder="Nhập họ và tên">
  </div>

  <div class="field">
    <label class="label" for="monDangKy">Môn thi đấu <span class="required">*</span></label>
    <select id="monDangKy" required>
      <option value="">-- Chọn môn thi đấu --</option>
      <option value="Chạy Marathon" id="optMarathon">Chạy Marathon Nam/Nữ (Cá nhân)</option>
      <option value="Kéo co" id="optKeoCo" class="hidden">Kéo co (Tug of War)</option>
      <option value="Nhảy bao jumbo" id="optJumbo" class="hidden">Nhảy bao Jumbo 1 tấn (Sack Race)</option>
      <option value="Trò chơi liên hoàn" id="optLienHoan" class="hidden">Trò chơi liên hoàn (Multi-stage Game)</option>
    </select>
    <div id="ruleMessage" class="rule hidden"></div>
  </div>

  <section id="groupSection" class="hidden">
    <div class="section">
      DANH SÁCH THÀNH VIÊN ĐỘI (<span id="memberCount">0</span> người)
      <button type="button" class="btn btn-secondary" id="addMemberBtn" style="float:right;padding:6px 10px">+ Người ngoài danh mục</button>
      <div style="clear:both"></div>
    </div>

    <div class="search-box">
      <label class="label" for="searchStaffInput">🔍 Tìm nhân viên bằng Tên, Mã NV hoặc CCCD</label>
      <input id="searchStaffInput" autocomplete="off" placeholder="Nhập từ khóa...">
      <div id="searchResultsList" class="results"></div>
    </div>

    <div class="table-wrap" style="margin-top:14px">
      <table class="members">
        <thead><tr><th>Họ và tên</th><th>Mã NV</th><th>4 số cuối CCCD</th><th>Bộ phận</th><th>Chức vụ</th><th>Xóa</th></tr></thead>
        <tbody id="memberListBody"></tbody>
      </table>
    </div>
  </section>

  <button class="btn btn-primary submit" type="submit" id="submitBtn">GỬI ĐĂNG KÝ / SUBMIT</button>
</form>
</section>
</main>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzSF32zHezk8gMhpiQrSbwSwWIbeLd4hzDhMjeW3Gch9wL9ZvMo2m6HYILSWrwVFJlL/exec";

const GAME_LIMITS = {
  "Kéo co": {min:6,max:10,msg:"Yêu cầu từ 6 đến 10 người"},
  "Nhảy bao jumbo": {min:10,max:10,msg:"Yêu cầu đúng 10 người"},
  "Trò chơi liên hoàn": {min:4,max:4,msg:"Yêu cầu đúng 4 người"}
};

let dbEmployees = [];
const $ = id => document.getElementById(id);

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}
function showStatus(message, type="error") {
  const el=$("status"); el.textContent=message; el.className="status "+type;
}
function hideStatus(){ $("status").className="status hidden"; }
function updateMemberCount(){ $("memberCount").textContent=$("memberListBody").querySelectorAll("tr").length; }

function setGroupMode() {
  const group=$("typeGroup").checked;
  $("groupSection").classList.toggle("hidden", !group);
  $("labelName").innerHTML = group
    ? 'Tên Đội thi đấu <span class="required">*</span>'
    : 'Họ và tên người đăng ký <span class="required">*</span>';
  $("tenFormTenDoi").placeholder = group ? "VD: Đội Cơ Khí Liwayway" : "VD: Nguyễn Văn A";

  ["optMarathon","optKeoCo","optJumbo","optLienHoan"].forEach(id => $(id).classList.add("hidden"));
  $(group ? "optKeoCo" : "optMarathon").classList.remove("hidden");
  if (group) {
    $("optJumbo").classList.remove("hidden");
    $("optLienHoan").classList.remove("hidden");
  }

  $("monDangKy").value="";
  $("ruleMessage").classList.add("hidden");
  $("ruleMessage").textContent="";
  $("searchStaffInput").value="";
  $("searchResultsList").innerHTML="";
  $("memberListBody").innerHTML="";
  updateMemberCount();
}

function renderSearchResults(keyword) {
  const box=$("searchResultsList"); box.innerHTML="";
  if (!keyword) return;

  const q=keyword.toLowerCase();
  const matched=dbEmployees.filter(emp =>
    emp.hoTen.toLowerCase().includes(q) ||
    emp.maNV.toLowerCase().includes(q) ||
    emp.cccd.includes(q)
  ).slice(0,8);

  if (!matched.length) {
    box.innerHTML='<div class="detail" style="padding:8px">Không tìm thấy nhân viên phù hợp.</div>';
    return;
  }

  matched.forEach(emp=>{
    const btn=document.createElement("button");
    btn.type="button"; btn.className="result";
    const masked=emp.cccd ? "****"+emp.cccd.slice(-4) : "Chưa có";
    btn.innerHTML =
      '<div class="result-main">'+escapeHtml(emp.hoTen)+' ('+escapeHtml(emp.maNV)+')</div>'+
      '<div class="detail">CCCD: '+escapeHtml(masked)+' | '+escapeHtml(emp.khoiLon)+' - '+escapeHtml(emp.boPhan)+' | '+escapeHtml(emp.chucVu)+'</div>';
    btn.addEventListener("click",()=>addMemberToTable(emp));
    box.appendChild(btn);
  });
}

function addMemberToTable(emp={}) {
  const id=String(emp.maNV||"").trim();
  const existing=[...document.querySelectorAll(".member-id")].map(x=>x.value.trim());
  if(id && existing.includes(id)){ showStatus("Nhân viên này đã có trong đội.","error"); return; }

  const game=$("monDangKy").value, limit=GAME_LIMITS[game];
  const count=$("memberListBody").querySelectorAll("tr").length;
  if(limit && count>=limit.max){ showStatus("Môn "+game+" đã đủ số lượng tối đa.","error"); return; }

  const tr=document.createElement("tr");
  const name=String(emp.hoTen||"");
  const cccd=String(emp.cccd||"");
  const readonly=id ? "readonly" : "";
  tr.innerHTML=
    '<td><input class="member-name" required value="'+escapeHtml(name)+'" '+readonly+'></td>'+
    '<td><input class="member-id" value="'+escapeHtml(id)+'" '+readonly+'></td>'+
    '<td><input class="member-cccd" value="'+escapeHtml(cccd ? cccd.slice(-4) : "")+'" '+readonly+' maxlength="4" inputmode="numeric"></td>'+
    '<td><input class="member-dept" required value="'+escapeHtml(emp.boPhan||"")+'" '+readonly+'></td>'+
    '<td><input class="member-pos" required value="'+escapeHtml(emp.chucVu||"")+'" '+readonly+'></td>'+
    '<td><button type="button" class="btn btn-danger remove-btn" style="padding:6px 9px">X</button></td>';
  tr.querySelector(".remove-btn").addEventListener("click",()=>{tr.remove();updateMemberCount();});
  $("memberListBody").appendChild(tr);
  updateMemberCount();
  hideStatus();
  $("searchStaffInput").value="";
  $("searchResultsList").innerHTML="";
}

function validateForm() {
  if (!$("registrationForm").checkValidity()) {
    $("registrationForm").reportValidity(); return false;
  }
  const group=$("typeGroup").checked, game=$("monDangKy").value;
  if (!group) return game==="Chạy Marathon";
  const rows=[...$("memberListBody").querySelectorAll("tr")], limit=GAME_LIMITS[game];
  if (!limit) { showStatus("Vui lòng chọn môn thi đấu."); return false; }
  if (rows.length<limit.min || rows.length>limit.max) {
    showStatus('Môn "'+game+'" yêu cầu '+(limit.min===limit.max ? "đúng "+limit.min : "từ "+limit.min+" đến "+limit.max)+" người. Hiện có "+rows.length+".");
    return false;
  }
  const ids=rows.map(r=>r.querySelector(".member-id").value.trim()).filter(Boolean);
  if (new Set(ids).size!==ids.length) { showStatus("Mã nhân viên trong đội không được trùng."); return false; }
  return true;
}

async function loadEmployees() {
  try {
    const response=await fetch(WEB_APP_URL+"?action=getEmployees",{redirect:"follow",cache:"no-store"});
    if(!response.ok) throw new Error("HTTP "+response.status);
    const res=await response.json();
    if(res.result!=="success") throw new Error(res.message||"API error");
    dbEmployees=Array.isArray(res.data)?res.data:[];
    $("loadingOverlay").classList.add("hidden");
  } catch(err) {
    console.error(err);
    $("loadingOverlay").classList.add("hidden");
    showStatus("Không thể tải danh sách nhân viên. Vui lòng tải lại trang hoặc kiểm tra Web App URL.");
  }
}

$("typeIndividual").addEventListener("change",setGroupMode);
$("typeGroup").addEventListener("change",setGroupMode);
$("monDangKy").addEventListener("change",()=>{
  const rule=GAME_LIMITS[$("monDangKy").value];
  $("ruleMessage").textContent=rule ? "⚠️ "+rule.msg : "";
  $("ruleMessage").classList.toggle("hidden",!rule);
});
$("searchStaffInput").addEventListener("input",e=>renderSearchResults(e.target.value.trim()));
$("addMemberBtn").addEventListener("click",()=>addMemberToTable());

$("registrationForm").addEventListener("submit",async e=>{
  e.preventDefault(); hideStatus();
  if(!validateForm()) return;

  const btn=$("submitBtn"); btn.disabled=true; btn.textContent="Đang lưu đăng ký...";
  const group=$("typeGroup").checked;
  let memberString="";
  if(group){
    memberString=[...$("memberListBody").querySelectorAll("tr")].map((tr,i)=>{
      const v=s=>tr.querySelector(s).value.trim();
      const id=v(".member-id"), cccd=v(".member-cccd");
      return (i+1)+". "+v(".member-name")+
        (id?" - MNV: "+id:"")+
        (cccd?" - CCCD 4 số cuối: "+cccd:"")+
        " [Bộ phận: "+v(".member-dept")+" - Chức vụ: "+v(".member-pos")+"]";
    }).join(" | ");
  }

  const payload={
    loaiDangKy:document.querySelector('input[name="loaiDangKy"]:checked').value,
    congTy:$("congTy").value,
    boPhan:$("boPhan").value.trim(),
    tenFormTenDoi:$("tenFormTenDoi").value.trim(),
    monDangKy:$("monDangKy").value,
    danhSachThanhVien:memberString
  };

  try{
    // text/plain avoids a CORS preflight with Apps Script Web Apps.
    const response=await fetch(WEB_APP_URL,{
      method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(payload),redirect:"follow"
    });
    const res=await response.json();
    if(res.result!=="success") throw new Error(res.message||"Không thể lưu đăng ký.");
    $("registrationForm").reset(); setGroupMode(); hideStatus();
    showStatus("Đăng ký thành công! Dữ liệu đã được lưu.","ok");
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(err){
    console.error(err); showStatus(err.message||"Lỗi kết nối. Vui lòng thử lại.");
  }finally{
    btn.disabled=false; btn.textContent="GỬI ĐĂNG KÝ / SUBMIT";
  }
});

setGroupMode();
loadEmployees();
</script>
</body>
</html>
